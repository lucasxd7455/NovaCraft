
name: Publish NovaCraft Beta

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload NovaCraft
        uses: actions/upload-pages-artifact@v3
        with:
          path: GAME

      - name: Publish NovaCraft
        id: deployment
        uses: actions/deploy-pages@v4
        
